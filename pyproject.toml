[project]
name = "polcheck"
version = "0.0.1"
description = "Regression testing for robots that run learned policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "duckdb>=1.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
polcheck = "polcheck.cli:main"

[project.entry-points."polcheck.readers"]
native = "polcheck.readers.native:NativeReader"
tabular = "polcheck.readers.tabular:TabularReader"

[project.optional-dependencies]
demo = [
    "mujoco>=3.1,<3.12",  # 3.12 enums stop comparing equal to ints; breaks gymnasium-robotics 1.4
    "gymnasium>=1.0",
    "gymnasium-robotics>=1.3",
    "imageio[ffmpeg]>=2.34",
]
train = [  # separate from demo: stable-baselines3 pulls in PyTorch
    "polcheck[demo]",
    "stable-baselines3>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polcheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["polcheck", "tests", "demo"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT012"]  # recorder tests need several calls inside one run block

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "mujoco", "mujoco.*", "gymnasium_robotics", "gymnasium_robotics.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
pythonpath = ["."]
markers = ["demo: needs the [demo] extra (MuJoCo); skipped when it is not installed"]
filterwarnings = ["ignore:.*AdroitHand.*"]
